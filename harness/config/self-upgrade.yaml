# self-upgrade.yaml — Harness 自我升级系统配置
# 控制自动修复的自动程度、安全边界和去重策略。
#
# 匹配规则：glob 模式，长匹配优先于短匹配。
# 若同一文件匹配多个 glob，选取最长匹配的那个。
# 若匹配到的规则中明确 disabled，则最终判定为 disabled（disabled 覆盖优先级最高）。
# 缺失字段使用下方注释标明的默认值。

# ---------------------------------------------------------------------------
# auto_levels: 按文件路径 glob 模式指定自动程度
#   auto       — 静默执行，不提示用户
#   semi-auto  — 展示 diff 等待用户确认 (y/n)
#   disabled   — 完全跳过
# ---------------------------------------------------------------------------
auto_levels:
  - glob: "harness/rules/*"
    level: auto
  - glob: "harness/workflow/*"
    level: semi-auto
  - glob: ".claude/agents/*"
    level: semi-auto
  - glob: ".claude/commands/*"
    level: semi-auto
  - glob: "harness/hooks/*"
    level: disabled
  - glob: "harness/skills/*"
    level: disabled
  # prompt 模板修改需要人工确认（防止 LLM 静默修改自己的诊断逻辑）
  - glob: "harness/prompts/*"
    level: semi-auto

# ---------------------------------------------------------------------------
# safety_boundary: 操作类型 + 改动量的安全边界
#   一级门禁判定规则：
#     - 新增行数 <= add_max_lines     → 通过
#     - 替换行数 <= replace_max_lines → 通过
#     - 包含任何删除操作               → require_confirmation（降级）
#     - 超过任一阈值                   → 降级输出到 rule-evolution-proposal.md
#   默认值（字段缺失时）：add_max_lines=50, replace_max_lines=20, delete=require_confirmation
# ---------------------------------------------------------------------------
safety_boundary:
  add_max_lines: 50
  replace_max_lines: 80
  delete: require_confirmation

# ---------------------------------------------------------------------------
# dedup: 24 小时去重窗口
#   同一 signal_id 在 window_hours 内已有成功修复记录 → 跳过
#   默认值（字段缺失时）：window_hours=24
# ---------------------------------------------------------------------------
dedup:
  window_hours: 24
